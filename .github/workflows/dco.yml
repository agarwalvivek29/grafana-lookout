# Developer Certificate of Origin: every commit in a pull request needs a Signed-off-by line that matches
# its author (git commit -s). See CONTRIBUTING.md.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qxF "$author"; then
              echo "ok      $sha $author"
            else
              echo "::error::Commit $sha by $author has no matching 'Signed-off-by: $author' line."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Sign off your commits: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
