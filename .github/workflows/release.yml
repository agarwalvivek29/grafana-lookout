# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/build-plugin@0247ace8990d6b0f9a62e9bffb00232798b360d3 # build-plugin/v2.0.0
        with:
          node-version: '24'
          go-version: '1.26.11'
          # Signing needs the plugin to be approved in the catalog. Until then releases are unsigned; after
          # approval set the repository variable SIGN_PLUGIN to "true" (gh variable set SIGN_PLUGIN --body true).
          policy_token: ${{ vars.SIGN_PLUGIN == 'true' && secrets.GRAFANA_ACCESS_POLICY_TOKEN || '' }}
