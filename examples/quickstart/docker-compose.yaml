# Lookout quickstart: Grafana + Prometheus + Loki + Tempo, a simulated online shop sending traces and logs,
# and the image renderer for panel previews. See README.md in this folder.
# For local trial only: anonymous users are Grafana admins here.
services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.4}
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: grafana-llm-app
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: agarwalvivek29-lookout-app
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: quickstart-renderer-token
    volumes:
      # Built plugin (npm run build && mage -v). After the first release this can be replaced by
      # GF_PLUGINS_PREINSTALL_SYNC=grafana-llm-app,agarwalvivek29-lookout-app
      - ../../dist:/var/lib/grafana/plugins/agarwalvivek29-lookout-app
      - ./provisioning:/etc/grafana/provisioning
    depends_on: [lgtm, renderer]

  # Prometheus, Loki, Tempo and an OpenTelemetry collector in one container (its own Grafana is not exposed).
  # Tempo's metrics generator writes span metrics (traces_spanmetrics_*) to Prometheus.
  lgtm:
    image: grafana/otel-lgtm:0.36.0

  # Simulated shop: frontend, catalog, checkout and payments. The payment provider has a recurring incident.
  demo-shop:
    build: ./demo-shop
    restart: unless-stopped
    environment:
      OTLP_ENDPOINT: lgtm:4317
    depends_on: [lgtm]

  # Optional: pictures of dashboard panels in answer previews.
  renderer:
    image: grafana/grafana-image-renderer:v5.12.7
    environment:
      AUTH_TOKEN: quickstart-renderer-token
